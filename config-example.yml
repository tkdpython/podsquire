# =============================================================================
# podsquire example configuration
# =============================================================================
# Copy this file, adjust it for your service, and pass it to --config:
#   podsquire --config /app/podsquire.yml
#
# Fetch certs only, useful as a Kubernetes init container:
#   podsquire --pull-certs-only /var/run/secrets/tls
#
# All top-level sections are optional. Enable only what you need.
# At least one of spire/static, subprocess, proxies, or enabled_proxy_presets
# must be present for a long-running podsquire process to do useful work.
# =============================================================================

# -----------------------------------------------------------------------------
# Vault secret injection (optional)
# -----------------------------------------------------------------------------
# Fetch key-value secrets from HashiCorp Vault using the pod's Kubernetes service
# account token. Secrets are delivered either to the supervised subprocess
# environment or to an atomically-written JSON file.
vault_secrets:
  # KV path to read. Can also be set with VAULT_KV_PATH.
  kv_path: ""  # leave blank to use VAULT_KV_PATH

  # Vault address. Defaults to VAULT_URL, then http://127.0.0.1:8200.
  # If you proxy Vault through podsquire, point this at the local proxy port.
  url: ""

  # Kubernetes auth role. Defaults to VAULT_ROLE, then "podsquire".
  role: ""

  # KV mount point and version. Mount can also come from VAULT_KV_MOUNT_POINT;
  # version can come from VAULT_KV_VERSION and defaults to 1.
  kv_mount_point: ""
  kv_version: 2

  # 0 = one-shot fetch at startup; positive value = poll every N minutes.
  refresh_interval_minutes: 0

  # env       = inject into podsquire's environment before launching subprocess
  # json_file = write an atomic JSON file for the subprocess to read/reload
  output_mode: env
  # json_file_path: /var/run/secrets/podsquire/vault-secrets.json

  # Optional signal sent to the subprocess only when fetched secrets change.
  # Use a restart-causing signal for env mode, or an app-specific reload signal
  # for json_file mode.
  # reload_signal: SIGTERM

# -----------------------------------------------------------------------------
# SPIRE / SPIFFE certificate management
# -----------------------------------------------------------------------------
# Remove this section if your container does not need SPIFFE certificates.
# Use static: instead when cert files are already mounted on disk.
spire:
  # SPIRE agent socket resolution order:
  #   1. this config value
  #   2. SPIFFE_ENDPOINT_SOCKET
  #   3. /run/spire/sockets/agent.sock
  # socket: unix:///run/spire/sockets/agent.sock

  # Paths where cert files will be written. Parent dirs are created.
  cert_path: /tmp/podsquire/tls.crt
  key_path: /tmp/podsquire/tls.key
  ca_path: /tmp/podsquire/ca.crt

  # Optional key+cert bundle for clients that need a single PEM file.
  combined_path: /tmp/podsquire/tls.key+cert

  renewal_interval: 60
  expiry_threshold: 3600
  retry_interval: 5

# -----------------------------------------------------------------------------
# Static cert source (alternative to spire:)
# -----------------------------------------------------------------------------
# static:
#   cert_path: /var/run/secrets/tls/tls.crt
#   key_path:  /var/run/secrets/tls/tls.key
#   ca_path:   /var/run/secrets/tls/ca.crt   # optional; enables verification

# -----------------------------------------------------------------------------
# Subprocess supervision
# -----------------------------------------------------------------------------
# Remove this section if podsquire runs as a sidecar instead of PID 1.
subprocess:
  command: "python3 -m podsquire.connectivity_test"
  # path: /app
  # reload_signal: SIGHUP  # sent when SPIFFE certs are renewed
  restart:
    enabled: true
    max_restarts: 3
    window_seconds: 120

# -----------------------------------------------------------------------------
# Optional proxy presets supplied by your own config
# -----------------------------------------------------------------------------
# podsquire does not bundle environment-specific service definitions. If you want
# short names for common services, define them here and enable them below.
proxy_presets:
  vault:
    mode: http
    local_host: 127.0.0.1
    local_port: 8200
    remote_host: vault.example.svc.cluster.local
    remote_port: 8200
    verify_remote: true
  mongo:
    mode: tcp
    local_host: 127.0.0.1
    local_port: 27017
    remote_host: mongodb.example.svc.cluster.local
    remote_port: 27017
    verify_remote: true

# Enable one or more names defined under proxy_presets.
# Explicit entries under proxies: with the same name override presets.
enabled_proxy_presets:
  - vault

# -----------------------------------------------------------------------------
# mTLS proxy listeners
# -----------------------------------------------------------------------------
# mode:
#   http — HTTP/1.1 reverse proxy with Host header rewriting
#   tcp  — raw byte tunnel for any TCP protocol, including MongoDB/gRPC
#
# verify_remote:
#   true  — validate server cert against the SPIFFE CA bundle
#   false — present client cert but skip server cert validation
proxies:
  - name: api
    mode: http
    local_host: 127.0.0.1
    local_port: 18080
    remote_host: api.default.svc.cluster.local
    remote_port: 8443
    verify_remote: true

# Example connectivity checks for podsquire.connectivity_test. Configure as an
# env var on the subprocess/container rather than hard-coding private services:
# PODSQUIRE_CHECKS_JSON='[{"name":"vault","url":"http://127.0.0.1:8200/v1/sys/health","ok_statuses":[200,429]}]'
